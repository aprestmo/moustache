name: Build Frontend and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
      - 'postcss.config.js'
      - '.gitea/workflows/build.yml'

concurrency:
  group: moustache-main-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # The Gitea runner's remote pnpm cache currently times out; Node 22 is
      # already available in the runner image, so avoid the cache round-trip.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Commit built assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore: build frontend assets [skip ci]"
          git push

      - name: Deploy committed assets to production
        env:
          MOUSTACHE_DEPLOY_SSH_KEY: ${{ secrets.MOUSTACHE_DEPLOY_SSH_KEY }}
          MOUSTACHE_DEPLOY_KNOWN_HOSTS: ${{ secrets.MOUSTACHE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${MOUSTACHE_DEPLOY_SSH_KEY:-}" ] || [ -z "${MOUSTACHE_DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "MOUSTACHE_DEPLOY_SSH_KEY and MOUSTACHE_DEPLOY_KNOWN_HOSTS must be configured as Gitea Actions repository secrets" >&2
            exit 1
          fi

          expected_commit="$(git rev-parse HEAD)"
          deploy_host="89.167.31.44"
          deploy_user="root"
          deploy_port="22"
          deploy_path="/mnt/HC_Volume_104573907/docker/volumes/v10zdqzt6cvc9ktlu4pyqyv2_wordpress-files/_data/wp-content/themes/moustache"
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          key_file="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"

          printf '%s\n' "$MOUSTACHE_DEPLOY_SSH_KEY" | sed 's/\r$//' > "$key_file"
          printf '%s\n' "$MOUSTACHE_DEPLOY_KNOWN_HOSTS" | sed '/^$/d' > "$known_hosts"
          chmod 600 "$key_file" "$known_hosts"

          remote_command="cd $deploy_path && MOUSTACHE_DEPLOY_SKIP_BUILD=1 MOUSTACHE_DEPLOY_STRICT=1 MOUSTACHE_DEPLOY_EXPECTED_COMMIT='$expected_commit' bash auto-deploy.sh"
          ssh \
            -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 \
            -p "$deploy_port" \
            "$deploy_user@$deploy_host" \
            "$remote_command"
